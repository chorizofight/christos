/* everything is sized in --u = 1/1080 of the page width, matching the 1080x1920 layout */
.page{--u:min(100vw,480px)/1080;width:min(100vw,480px);min-height:100vh;min-height:100dvh;margin:0 auto;padding-top:calc(40*var(--u));padding-bottom:calc(110*var(--u));display:flex;flex-direction:column}
.hero{display:block;width:100%;height:auto}
h1{font-size:0;line-height:0}
.pickup{margin:calc(54*var(--u)) 0 0 calc(63*var(--u));color:#f3eedd;font-size:calc(45*var(--u));line-height:calc(41*var(--u));letter-spacing:-.035em;word-spacing:-.08em;text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:space-between;margin:calc(21*var(--u)) calc(61*var(--u)) 0 calc(63*var(--u));height:calc(187*var(--u));padding:0 calc(40*var(--u)) 0 calc(70*var(--u));background:#f3eedd;color:#002d1b;border-radius:calc(6*var(--u));text-decoration:none;font-size:calc(81*var(--u));line-height:1;letter-spacing:-.034em;word-spacing:-.06em;text-transform:uppercase;white-space:nowrap;transition:transform .12s ease,background .12s ease}
.btn + .btn{margin-top:calc(44*var(--u))}
.btn span{padding-top:calc(13*var(--u))}
.btn::after{content:"";flex:none;border-style:solid;border-width:calc(39*var(--u)) 0 calc(39*var(--u)) calc(46*var(--u));border-color:transparent transparent transparent #ffb771}
.btn:hover{background:#fff8e6}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.ig:focus-visible{outline:calc(6*var(--u)) solid #ffb771;outline-offset:calc(6*var(--u))}
.ig{margin:auto auto 0;padding-top:calc(120*var(--u));color:#f3eedd;display:block;line-height:0;transition:color .12s ease}
.ig svg{width:calc(104*var(--u));height:calc(104*var(--u));display:block}
.ig:hover{color:#ffb771}
</style>
